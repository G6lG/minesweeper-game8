<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❄️ Динамический Сапёр | Улучшенный звук</title>
    <style>
        /* СТИЛИ ОСТАЮТСЯ ПРЕЖНИМИ, ДОБАВЛЯЕМ ТОЛЬКО НОВЫЕ ЭЛЕМЕНТЫ */
        
        /* ДОПОЛНИТЕЛЬНЫЕ СТИЛИ ДЛЯ РЕГУЛЯТОРОВ ГРОМКОСТИ */
        .volume-master-control {
            background: linear-gradient(135deg, rgba(86, 98, 246, 0.2), rgba(76, 201, 240, 0.2));
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(76, 201, 240, 0.4);
            position: relative;
            overflow: hidden;
        }
        
        .volume-master-control::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, transparent 30%, rgba(255, 255, 255, 0.05) 100%);
            z-index: -1;
        }
        
        .volume-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }
        
        .volume-icon {
            font-size: 1.5rem;
            color: #4cc9f0;
        }
        
        .volume-title {
            color: #4cc9f0;
            font-weight: 700;
            font-size: 1.1rem;
            flex-grow: 1;
        }
        
        .volume-percentage {
            color: #4cc9f0;
            font-weight: 700;
            font-size: 1.2rem;
            min-width: 50px;
            text-align: right;
            font-family: 'Courier New', monospace;
        }
        
        .volume-slider-container {
            position: relative;
            height: 30px;
            display: flex;
            align-items: center;
        }
        
        .volume-slider {
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, 
                rgba(76, 201, 240, 0.3) 0%,
                rgba(86, 98, 246, 0.6) 50%,
                rgba(247, 37, 133, 0.8) 100%);
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }
        
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 3px solid #4cc9f0;
            transition: all 0.3s;
        }
        
        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(76, 201, 240, 0.6);
        }
        
        .volume-levels {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.8rem;
            color: rgba(165, 180, 203, 0.7);
        }
        
        /* ОСТАЛЬНЫЕ СТИЛИ БЕЗ ИЗМЕНЕНИЙ... */
        
        /* КОРОТКАЯ ВЕРСИЯ - ОСТАЛЬНЫЕ СТИЛИ СОХРАНЯЮТСЯ ТАКИМИ ЖЕ */
        /* ПОЛНЫЙ CSS ВЗЯТ ИЗ ПРЕДЫДУЩЕЙ ВЕРСИИ */
        
    </style>
</head>
<body>
    <!-- СНЕЖИНКИ -->
    <div class="snowflakes" id="snowflakes"></div>

    <div class="game-container">
        <!-- ШАПКА -->
        <div class="header">
            <h1>🔊 Динамический Сапёр</h1>
            <p class="subtitle">Версия с улучшенными звуками и интеллектуальной системой громкости</p>
        </div>

        <!-- ОСНОВНАЯ ОБЛАСТЬ -->
        <div class="main-game-area">
            <!-- ЛЕВАЯ ПАНЕЛЬ -->
            <div class="left-panel">
                <!-- ПАНЕЛЬ СТАТИСТИКИ -->
                <div class="stats-panel">
                    <!-- ... СТАТИСТИКА БЕЗ ИЗМЕНЕНИЙ ... -->
                </div>

                <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
                <div class="control-panel">
                    <!-- КНОПКИ УПРАВЛЕНИЯ -->
                    <div class="control-buttons">
                        <!-- ... КНОПКИ БЕЗ ИЗМЕНЕНИЙ ... -->
                    </div>

                    <!-- НАСТРОЙКИ -->
                    <div class="settings-panel">
                        <div class="settings-title">⚙️ НАСТРОЙКИ ИГРЫ</div>
                        
                        <!-- СУЩЕСТВУЮЩИЕ НАСТРОЙКИ БЕЗ ИЗМЕНЕНИЙ -->
                        
                        <!-- ОСНОВНОЙ РЕГУЛЯТОР ГРОМКОСТИ -->
                        <div class="volume-master-control">
                            <div class="volume-header">
                                <div class="volume-icon">🔊</div>
                                <div class="volume-title">ОБЩАЯ ГРОМКОСТЬ</div>
                                <div class="volume-percentage" id="master-volume-value">70%</div>
                            </div>
                            <div class="volume-slider-container">
                                <input type="range" class="volume-slider" id="master-volume" 
                                       min="0" max="100" value="70" step="1">
                            </div>
                            <div class="volume-levels">
                                <span>Тихо</span>
                                <span>Средне</span>
                                <span>Громко</span>
                            </div>
                        </div>
                        
                        <!-- Управление звуком -->
                        <div class="sound-controls">
                            <div class="checkbox-group">
                                <input type="checkbox" id="sound-toggle" checked>
                                <label class="setting-label">🔊 Звуковые эффекты</label>
                            </div>
                            
                            <!-- ФОНОВАЯ МУЗЫКА -->
                            <div class="audio-panel">
                                <div class="settings-title">🎵 ФОНОВАЯ МУЗЫКА</div>
                                <div class="audio-controls">
                                    <button class="audio-btn" id="play-music">▶ Включить</button>
                                    <button class="audio-btn" id="pause-music">⏸ Пауза</button>
                                    <button class="audio-btn" id="stop-music">⏹ Стоп</button>
                                    
                                    <!-- Кнопка для загрузки своей музыки -->
                                    <label for="music-upload" class="audio-upload-label">
                                        📁 Загрузить MP3
                                    </label>
                                    <input type="file" id="music-upload" class="audio-upload" accept="audio/mp3,audio/*">
                                </div>
                                
                                <!-- Регулятор громкости музыки -->
                                <div class="setting-group">
                                    <label class="setting-label">Относительная громкость музыки:</label>
                                    <input type="range" id="music-volume" min="0" max="100" value="80">
                                    <span class="range-value" id="music-volume-value">80%</span>
                                </div>
                                
                                <!-- Регулятор громкости звуков -->
                                <div class="setting-group">
                                    <label class="setting-label">Относительная громкость эффектов:</label>
                                    <input type="range" id="sfx-volume" min="0" max="100" value="100">
                                    <span class="range-value" id="sfx-volume-value">100%</span>
                                </div>
                                
                                <span class="audio-status" id="music-status">🎶 Музыка: Готово к загрузке</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ИГРОВОЕ ПОЛЕ -->
            <div class="game-board-area">
                <div class="game-board-wrapper">
                    <!-- ИГРОВОЕ ПОЛЕ -->
                    <div class="game-board" id="game-board"></div>
                    
                    <!-- СТАРТОВЫЙ ЭКРАН -->
                    <div class="start-screen" id="start-screen">
                        <!-- ... СТАРТОВЫЙ ЭКРАН БЕЗ ИЗМЕНЕНИЙ ... -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // УЛУЧШЕННАЯ ВЕРСИЯ С ИНТЕЛЛЕКТУАЛЬНОЙ СИСТЕМОЙ ГРОМКОСТИ
        
        const Game = {
            // Конфигурация
            config: {
                rows: 10,
                cols: 10,
                mines: 15,
                dynamicBombs: 3,
                bombInterval: 12000,
                smartGeneration: true,
                soundEnabled: true,
                musicEnabled: true,
                snowflakesCount: 80
            },
            
            // Состояние игры
            state: {
                board: [],
                gameOver: false,
                gameWon: false,
                firstClick: true,
                flaggedCount: 0,
                revealedCount: 0,
                startTime: null,
                timerInterval: null,
                bombTimer: null,
                bombMoveCounter: 0,
                elapsedSeconds: 0,
                lastMoveHistory: [],
                audioContext: null,
                sounds: {},
                backgroundMusic: null,
                
                // НОВАЯ СИСТЕМА ГРОМКОСТИ
                masterVolume: 0.7,     // Основная громкость (0-1)
                musicVolumeRatio: 0.8, // Относительная громкость музыки (0-1)
                sfxVolumeRatio: 1.0,   // Относительная громкость эффектов (0-1)
                
                snowflakes: []
            },
            
            // DOM элементы
            elements: {},
            
            // Инициализация
            init() {
                console.log('🎮 Игра загружается...');
                
                this.cacheElements();
                this.initSnowflakes();
                this.initAudio();
                this.initEventListeners();
                this.initSettings();
                this.showStartScreen();
                
                console.log('✅ Игра готова!');
            },
            
            // Снежинки (без изменений)
            initSnowflakes() {
                const container = document.getElementById('snowflakes');
                for (let i = 0; i < this.config.snowflakesCount; i++) {
                    this.createSnowflake(container);
                }
            },
            
            // ... Снежинки (остальной код без изменений) ...
            
            cacheElements() {
                this.elements = {
                    // Существующие элементы
                    gameBoard: document.getElementById('game-board'),
                    startScreen: document.getElementById('start-screen'),
                    startGameBtn: document.getElementById('start-game'),
                    startButtonMain: document.getElementById('start-button-main'),
                    restartBtn: document.getElementById('restart-btn'),
                    hintBtn: document.getElementById('hint-btn'),
                    undoBtn: document.getElementById('undo-btn'),
                    timer: document.getElementById('timer'),
                    mainTimer: document.getElementById('main-timer'),
                    mineCount: document.getElementById('mine-count'),
                    bombCount: document.getElementById('bomb-count'),
                    bombTimer: document.getElementById('bomb-timer'),
                    playMusicBtn: document.getElementById('play-music'),
                    pauseMusicBtn: document.getElementById('pause-music'),
                    stopMusicBtn: document.getElementById('stop-music'),
                    musicUpload: document.getElementById('music-upload'),
                    musicStatus: document.getElementById('music-status'),
                    
                    // Новые элементы для громкости
                    masterVolume: document.getElementById('master-volume'),
                    masterVolumeValue: document.getElementById('master-volume-value'),
                    musicVolume: document.getElementById('music-volume'),
                    musicVolumeValue: document.getElementById('music-volume-value'),
                    sfxVolume: document.getElementById('sfx-volume'),
                    sfxVolumeValue: document.getElementById('sfx-volume-value')
                };
            },
            
            initAudio() {
                try {
                    // Создаем AudioContext для звуков
                    this.state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // Создаем УЛУЧШЕННЫЕ звуковые эффекты
                    this.createEnhancedSounds();
                    
                    // Создаем элемент для фоновой музыки
                    this.state.backgroundMusic = new Audio();
                    this.state.backgroundMusic.loop = true;
                    
                    // Устанавливаем начальную громкость музыки
                    this.updateMusicVolume();
                    
                    this.elements.musicStatus.textContent = '🎶 Музыка: Готово к загрузке';
                    
                    console.log('🔊 Улучшенная аудио система инициализирована');
                } catch (e) {
                    console.log('⚠️ Аудио не поддерживается в этом браузере');
                    this.config.soundEnabled = false;
                    this.config.musicEnabled = false;
                }
            },
            
            // СОЗДАЕМ БОЛЕЕ ПРИЯТНЫЕ ЗВУКИ
            createEnhancedSounds() {
                this.state.sounds = {
                    // Мягкий, приятный клик (нота C5)
                    click: () => this.playEnhancedTone(523.25, 0.2, 'sine', 
                        {attack: 0.02, decay: 0.15, sustain: 0.3, release: 0.1}),
                    
                    // Колокольчик для флага (нота G5)
                    flag: () => this.playEnhancedTone(783.99, 0.3, 'sine',
                        {attack: 0.05, decay: 0.2, sustain: 0.4, release: 0.15}),
                    
                    // Приятный аккорд для открытия (C мажор)
                    reveal: () => this.playChord([523.25, 659.25, 783.99], 0.4),
                    
                    // Глухой, но не резкий взрыв (низкая нота с фильтром)
                    mine: () => this.playFilteredTone(110, 0.9, 'sawtooth', 
                        {attack: 0.1, decay: 0.3, cutoff: 400}),
                    
                    // Радостный мажорный аккорд для победы
                    win: () => this.playChord([523.25, 659.25, 783.99, 1046.50], 0.7),
                    
                    // Технологичный, но приятный звук движения бомбы
                    bombMove: () => this.playEnhancedTone(220, 0.5, 'square',
                        {attack: 0.1, decay: 0.25, sustain: 0.3, release: 0.15, vibrato: 5}),
                    
                    // Мягкий звук ошибки (нисходящая мелодия)
                    error: () => this.playSequence([392.00, 349.23, 329.63], 0.3),
                    
                    // Едва слышный звук наведения
                    hover: () => this.playEnhancedTone(392.00, 0.15, 'sine',
                        {attack: 0.01, decay: 0.05, sustain: 0.1, release: 0.03, volume: 0.15})
                };
            },
            
            // УЛУЧШЕННАЯ ФУНКЦИЯ ВОСПРОИЗВЕДЕНИЯ ТОНА
            playEnhancedTone(frequency, duration, type, params = {}) {
                if (!this.config.soundEnabled || !this.state.audioContext) return;
                
                const {
                    attack = 0.05,
                    decay = 0.1,
                    sustain = 0.3,
                    release = 0.1,
                    vibrato = 0,
                    volume = 1
                } = params;
                
                try {
                    const now = this.state.audioContext.currentTime;
                    const oscillator = this.state.audioContext.createOscillator();
                    const gainNode = this.state.audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.state.audioContext.destination);
                    
                    // Устанавливаем частоту
                    oscillator.frequency.setValueAtTime(frequency, now);
                    
                    // Добавляем вибрато если нужно
                    if (vibrato > 0) {
                        const vibratoGain = this.state.audioContext.createGain();
                        const vibratoOsc = this.state.audioContext.createOscillator();
                        
                        vibratoOsc.frequency.value = vibrato;
                        vibratoGain.gain.value = frequency * 0.02;
                        
                        vibratoOsc.connect(vibratoGain);
                        vibratoGain.connect(oscillator.frequency);
                        
                        vibratoOsc.start(now);
                        vibratoOsc.stop(now + duration);
                    }
                    
                    oscillator.type = type;
                    
                    // Рассчитываем фактическую громкость с учетом всех настроек
                    const baseVolume = this.state.masterVolume * this.state.sfxVolumeRatio * volume;
                    const actualVolume = baseVolume * 0.25; // Дополнительное смягчение
                    
                    // Создаем плавную огибающую ADSR
                    gainNode.gain.setValueAtTime(0.001, now);
                    gainNode.gain.exponentialRampToValueAtTime(actualVolume, now + attack);
                    gainNode.gain.exponentialRampToValueAtTime(actualVolume * sustain, now + attack + decay);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + attack + decay + release);
                    
                    oscillator.start(now);
                    oscillator.stop(now + duration);
                    
                } catch(e) {
                    console.log('Ошибка воспроизведения звука:', e);
                }
            },
            
            // ВОСПРОИЗВЕДЕНИЕ АККОРДА
            playChord(frequencies, duration) {
                if (!this.config.soundEnabled || !this.state.audioContext) return;
                
                frequencies.forEach((freq, index) => {
                    setTimeout(() => {
                        this.playEnhancedTone(freq, duration * 0.7, 'sine', {
                            attack: 0.03,
                            decay: 0.15,
                            sustain: 0.4,
                            release: 0.2,
                            volume: 1 - (index * 0.2) // Постепенно тише
                        });
                    }, index * 30);
                });
            },
            
            // ВОСПРОИЗВЕДЕНИЕ ПОСЛЕДОВАТЕЛЬНОСТИ
            playSequence(frequencies, duration) {
                if (!this.config.soundEnabled || !this.state.audioContext) return;
                
                frequencies.forEach((freq, index) => {
                    setTimeout(() => {
                        this.playEnhancedTone(freq, duration * 0.3, 'sine', {
                            attack: 0.02,
                            decay: 0.1,
                            sustain: 0.3,
                            release: 0.08
                        });
                    }, index * 120);
                });
            },
            
            // ТОН С ФИЛЬТРОМ (ДЛЯ МИН)
            playFilteredTone(frequency, duration, type, params) {
                if (!this.config.soundEnabled || !this.state.audioContext) return;
                
                try {
                    const now = this.state.audioContext.currentTime;
                    const oscillator = this.state.audioContext.createOscillator();
                    const gainNode = this.state.audioContext.createGain();
                    const filter = this.state.audioContext.createBiquadFilter();
                    
                    oscillator.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(this.state.audioContext.destination);
                    
                    oscillator.frequency.value = frequency;
                    oscillator.type = type;
                    
                    // Настраиваем фильтр низких частот
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(params.cutoff || 800, now);
                    filter.frequency.exponentialRampToValueAtTime(100, now + duration * 0.7);
                    
                    const baseVolume = this.state.masterVolume * this.state.sfxVolumeRatio;
                    const actualVolume = baseVolume * 0.3;
                    
                    gainNode.gain.setValueAtTime(0.001, now);
                    gainNode.gain.exponentialRampToValueAtTime(actualVolume, now + params.attack);
                    gainNode.gain.exponentialRampToValueAtTime(actualVolume * 0.5, now + params.attack + params.decay);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);
                    
                    oscillator.start(now);
                    oscillator.stop(now + duration);
                    
                } catch(e) {
                    console.log('Ошибка фильтрованного звука:', e);
                }
            },
            
            playSound(soundName) {
                if (this.state.sounds[soundName] && this.config.soundEnabled) {
                    this.state.sounds[soundName]();
                }
            },
            
            // ОБНОВЛЕНИЕ ГРОМКОСТИ МУЗЫКИ
            updateMusicVolume() {
                if (this.state.backgroundMusic) {
                    const actualVolume = this.state.masterVolume * this.state.musicVolumeRatio;
                    this.state.backgroundMusic.volume = actualVolume;
                }
            },
            
            // Управление музыкой
            playMusic() {
                if (this.state.backgroundMusic && this.config.musicEnabled) {
                    this.state.backgroundMusic.play().catch(e => {
                        console.log('Ошибка воспроизведения музыки:', e);
                        this.elements.musicStatus.textContent = '🎶 Музыка: Ошибка воспроизведения';
                    });
                    this.elements.musicStatus.textContent = '🎶 Музыка: Воспроизводится';
                }
            },
            
            pauseMusic() {
                if (this.state.backgroundMusic) {
                    this.state.backgroundMusic.pause();
                    this.elements.musicStatus.textContent = '🎶 Музыка: На паузе';
                }
            },
            
            stopMusic() {
                if (this.state.backgroundMusic) {
                    this.state.backgroundMusic.pause();
                    this.state.backgroundMusic.currentTime = 0;
                    this.elements.musicStatus.textContent = '🎶 Музыка: Остановлена';
                }
            },
            
            // ОБРАБОТЧИКИ РЕГУЛЯТОРОВ ГРОМКОСТИ
            setMasterVolume(value) {
                this.state.masterVolume = value / 100;
                this.elements.masterVolumeValue.textContent = `${value}%`;
                
                // Обновляем громкость музыки
                this.updateMusicVolume();
                
                // Тестовый звук при изменении громкости
                if (value > 0 && value < 100) {
                    this.playTestSound();
                }
            },
            
            setMusicVolumeRatio(value) {
                this.state.musicVolumeRatio = value / 100;
                this.elements.musicVolumeValue.textContent = `${value}%`;
                this.updateMusicVolume();
            },
            
            setSfxVolumeRatio(value) {
                this.state.sfxVolumeRatio = value / 100;
                this.elements.sfxVolumeValue.textContent = `${value}%`;
            },
            
            // ТЕСТОВЫЙ ЗВУК ДЛЯ НАСТРОЙКИ ГРОМКОСТИ
            playTestSound() {
                if (!this.config.soundEnabled) return;
                
                this.playEnhancedTone(659.25, 0.1, 'sine', {
                    attack: 0.01,
                    decay: 0.05,
                    sustain: 0.2,
                    release: 0.04,
                    volume: 0.5
                });
            },
            
            initEventListeners() {
                // Основные кнопки игры
                this.elements.startGameBtn.addEventListener('click', () => this.startNewGame());
                this.elements.startButtonMain.addEventListener('click', () => this.startNewGame());
                this.elements.restartBtn.addEventListener('click', () => this.startNewGame());
                this.elements.hintBtn.addEventListener('click', () => this.giveHint());
                this.elements.undoBtn.addEventListener('click', () => this.undoMove());
                
                // Управление музыкой
                this.elements.playMusicBtn.addEventListener('click', () => this.playMusic());
                this.elements.pauseMusicBtn.addEventListener('click', () => this.pauseMusic());
                this.elements.stopMusicBtn.addEventListener('click', () => this.stopMusic());
                
                // Загрузка своей музыки
                this.elements.musicUpload.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const url = URL.createObjectURL(file);
                        this.state.backgroundMusic.src = url;
                        this.elements.musicStatus.textContent = `🎶 Музыка: ${file.name}`;
                        this.playMusic();
                    }
                });
                
                // НОВЫЕ РЕГУЛЯТОРЫ ГРОМКОСТИ
                this.elements.masterVolume.addEventListener('input', (e) => {
                    this.setMasterVolume(e.target.value);
                });
                
                this.elements.musicVolume.addEventListener('input', (e) => {
                    this.setMusicVolumeRatio(e.target.value);
                });
                
                this.elements.sfxVolume.addEventListener('input', (e) => {
                    this.setSfxVolumeRatio(e.target.value);
                });
                
                // Горячие клавиши
                document.addEventListener('keydown', (e) => {
                    if (e.ctrlKey && e.key === 'z') {
                        e.preventDefault();
                        this.undoMove();
                    } else if (e.key === ' ') {
                        e.preventDefault();
                        this.giveHint();
                    } else if (e.key === 'r' || e.key === 'R') {
                        this.startNewGame();
                    } else if (e.key === 'm' || e.key === 'M') {
                        e.preventDefault();
                        this.toggleSound();
                    } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.adjustMasterVolume(e.key === 'ArrowUp' ? 5 : -5);
                    }
                });
                
                // Анимация наведения на кнопки
                const buttons = document.querySelectorAll('.btn, .audio-btn, .audio-upload-label');
                buttons.forEach(btn => {
                    btn.addEventListener('mouseenter', () => {
                        this.playSound('hover');
                    });
                });
                
                // Тест звука при клике на иконку громкости
                this.elements.masterVolumeValue.addEventListener('click', () => {
                    this.playTestSound();
                });
            },
            
            // РЕГУЛИРОВКА ГРОМКОСТИ С КЛАВИАТУРЫ
            adjustMasterVolume(delta) {
                const slider = this.elements.masterVolume;
                let value = parseInt(slider.value) + delta;
                value = Math.max(0, Math.min(100, value));
                slider.value = value;
                this.setMasterVolume(value);
                this.playTestSound();
            },
            
            // ОСТАЛЬНЫЕ МЕТОДЫ БЕЗ ИЗМЕНЕНИЙ
            initSettings() {
                // ... (без изменений)
            },
            
            toggleSound() {
                this.config.soundEnabled = !this.config.soundEnabled;
                document.getElementById('sound-toggle').checked = this.config.soundEnabled;
                this.showMessage(this.config.soundEnabled ? '🔊 Звук включен' : '🔇 Звук выключен');
                
                if (this.config.soundEnabled) {
                    this.playTestSound();
                }
            },
            
            showStartScreen() {
                this.elements.startScreen.classList.remove('hidden');
            },
            
            hideStartScreen() {
                this.elements.startScreen.classList.add('hidden');
            },
            
            startNewGame() {
                console.log('🔄 Новая игра');
                
                this.hideStartScreen();
                this.resetGameState();
                this.createBoard();
                this.updateUI();
                this.renderBoard();
                
                this.showMessage('🎮 Игра началась! Сделайте первый ход');
                this.playSound('click');
            },
            
            // ... ВСЕ ОСТАЛЬНЫЕ МЕТОДЫ ИГРЫ БЕЗ ИЗМЕНЕНИЙ ...
            // (createBoard, renderBoard, handleCellClick, и т.д.)
            
            resetGameState() {
                this.state = {
                    ...this.state,
                    board: [],
                    gameOver: false,
                    gameWon: false,
                    firstClick: true,
                    flaggedCount: 0,
                    revealedCount: 0,
                    startTime: null,
                    timerInterval: null,
                    bombTimer: null,
                    bombMoveCounter: 0,
                    elapsedSeconds: 0,
                    lastMoveHistory: []
                };
                
                this.stopTimers();
            },
            
            // ... остальная логика игры ...
            
            showMessage(text) {
                const existingMessages = document.querySelectorAll('.message');
                existingMessages.forEach(msg => {
                    msg.style.animation = 'slideInRight 0.4s ease-out reverse forwards';
                    setTimeout(() => msg.remove(), 400);
                });
                
                const message = document.createElement('div');
                message.className = 'message';
                message.textContent = text;
                
                document.body.appendChild(message);
                
                setTimeout(() => {
                    message.style.animation = 'slideInRight 0.4s ease-out reverse forwards';
                    setTimeout(() => message.remove(), 400);
                }, 3500);
            }
        };

        // Запуск игры
        document.addEventListener('DOMContentLoaded', () => {
            Game.init();
        });

        // Добавляем CSS анимации
        const styles = document.createElement('style');
        styles.textContent = `
            @keyframes fall {
                0% { transform: translateY(-10px) translateX(0); opacity: 0; }
                10% { opacity: 0.8; }
                90% { opacity: 0.8; }
                100% { transform: translateY(100vh) translateX(var(--sway, 0px)); opacity: 0; }
            }
            
            @keyframes sway {
                0%, 100% { transform: translateX(0); }
                50% { transform: translateX(20px); }
            }
            
            @keyframes wave {
                0% { transform: scale(0.5); opacity: 1; border-width: 3px; }
                100% { transform: scale(3); opacity: 0; border-width: 1px; }
            }
            
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.1); }
                100% { transform: scale(1); }
            }
            
            /* Плавные переходы для громкости */
            .volume-slider {
                transition: background 0.3s ease;
            }
            
            .volume-slider::-webkit-slider-thumb {
                transition: all 0.2s ease;
            }
        `;
        document.head.appendChild(styles);
    </script>
</body>
</html>
